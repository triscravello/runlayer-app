# Prometheus config for scraping /api/metrics when METRICS_TOKEN is set.
# Used by docker-compose.observability.auth.yml; the default prometheus.yml is for the unauthenticated
# local workflow (METRICS_TOKEN unset, NODE_ENV=development).
#
# The token is read from a file mounted into the container (never stored in this tracked file).
global:
  scrape_interval: 10s

scrape_configs:
  - job_name: 'nextjs-app'
    metrics_path: '/api/metrics'
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ['host.docker.internal:3000']
